name: Deploy QA

on:
  push:
    branches:
      - qa

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/ec2-user/app

            # Sincronizar código (reset fuerza limpieza de cambios locales como el sed de %API_URL%)
            git fetch origin qa
            git reset --hard origin/qa

            # Inyectar URL real del servidor en el frontend
            sed -i "s|%API_URL%|http://${{ secrets.EC2_HOST }}:8080|g" frontend/public/index.html

            # .env raíz para docker-compose (postgres, healthcheck y Moodle dockerizado)
            cat > .env << ENVEOF
            DB_NAME=voucherdb
            DB_USER=admin
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            MOODLE_SITE_URL=http://${{ secrets.EC2_HOST }}:8095
            MOODLE_ADMIN_PASSWORD=${{ secrets.MOODLE_ADMIN_PASSWORD }}
            ENVEOF

            # .env del servicio Node.js
            cat > servicios/servicio-usuarios/.env << ENVEOF
            DB_HOST=postgres
            DB_PORT=5432
            DB_NAME=voucherdb
            DB_USER=admin
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ADMIN_EMAIL=admin@certjoin.com
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            PARTNER_EMAIL=partner@certjoin.com
            PARTNER_PASSWORD=${{ secrets.PARTNER_PASSWORD }}
            STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            FRONTEND_URL=http://${{ secrets.EC2_HOST }}:3000
            PORT=8081
            NODE_ENV=production
            REFRESH_TOKEN_TTL_DAYS=7
            SESSION_TIMEOUT_MINUTES=30
            MAX_LOGIN_ATTEMPTS=10
            RATE_LIMIT_WINDOW_MINUTES=15
            RATE_LIMIT_MAX_REQUESTS=100
            MOODLE_URL=http://moodle:8080
            MOODLE_TOKEN=${{ secrets.MOODLE_TOKEN }}
            MOODLE_ROLE_ID=5
            MOODLE_MOCK=false
            MOODLE_PUBLIC_URL=${{ secrets.MOODLE_PUBLIC_URL }}
            CAMPUS_URL=${{ secrets.CAMPUS_URL }}
            MAIL_ENABLED=${{ secrets.MAIL_ENABLED }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_SECURE=${{ secrets.SMTP_SECURE }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            MAIL_FROM=${{ secrets.MAIL_FROM }}
            MAIL_FROM_NAME=CertJoin
            MAIL_REPLY_TO=${{ secrets.MAIL_REPLY_TO }}
            MAIL_LOGO_URL=${{ secrets.MAIL_LOGO_URL }}
            ENVEOF

            # Crear directorio de logs
            mkdir -p logs/usuarios

            # Actualizar buildx
            BUILDX_VER=$(curl -s https://api.github.com/repos/docker/buildx/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -SL "https://github.com/docker/buildx/releases/download/${BUILDX_VER}/buildx-${BUILDX_VER}.linux-amd64" \
              -o /usr/local/lib/docker/cli-plugins/docker-buildx
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

            # Levantar contenedores (incluye Moodle dockerizado vía perfil local-moodle)
            docker compose --profile local-moodle down --remove-orphans
            docker compose --profile local-moodle up -d --build

            # Verificar estado
            docker compose --profile local-moodle ps
