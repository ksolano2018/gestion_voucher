name: Deploy QA

on:
  push:
    branches:
      - qa

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy en EC2
        uses: appleboy/ssh-action@v1.0.3
        # Los secretos se pasan como variables de entorno (env: + envs:) en lugar de
        # interpolarse dentro del texto del `script`. Así no aparecen en la línea de
        # comando ni en el historial del shell remoto; appleboy los exporta en el host
        # y los heredocs (<< ENVEOF, sin comillas) los expanden allí.
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MOODLE_ADMIN_PASSWORD: ${{ secrets.MOODLE_ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PARTNER_PASSWORD: ${{ secrets.PARTNER_PASSWORD }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          MOODLE_PUBLIC_URL: ${{ vars.MOODLE_PUBLIC_URL || secrets.MOODLE_PUBLIC_URL }}
          CAMPUS_URL: ${{ vars.CAMPUS_URL || secrets.CAMPUS_URL }}
          MAIL_ENABLED: ${{ vars.MAIL_ENABLED || secrets.MAIL_ENABLED }}
          SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE || secrets.SMTP_SECURE }}
          SMTP_USER: ${{ vars.SMTP_USER || secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || vars.SMTP_PASS }}
          MAIL_FROM: ${{ vars.MAIL_FROM || secrets.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ vars.MAIL_REPLY_TO || secrets.MAIL_REPLY_TO }}
          MAIL_LOGO_URL: ${{ vars.MAIL_LOGO_URL || secrets.MAIL_LOGO_URL }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          envs: EC2_HOST,DB_PASSWORD,MOODLE_ADMIN_PASSWORD,JWT_SECRET,ADMIN_PASSWORD,PARTNER_PASSWORD,STRIPE_PUBLISHABLE_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,MOODLE_TOKEN,MOODLE_PUBLIC_URL,CAMPUS_URL,MAIL_ENABLED,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS,MAIL_FROM,MAIL_REPLY_TO,MAIL_LOGO_URL,INTERNAL_API_TOKEN
          script: |
            set -e
            cd /home/ec2-user/app

            # Sincronizar código (reset fuerza limpieza de cambios locales como el sed de %API_URL%)
            git fetch origin qa
            git reset --hard origin/qa

            # El frontend usa rutas relativas (mismo origen vía gateway); el %API_URL%
            # queda vestigial pero se reemplaza por compatibilidad.
            sed -i "s|%API_URL%||g" frontend/public/index.html

            # .env raíz para docker-compose. GATEWAY_PORT=3000: el gateway (Caddy) se
            # publica en :3000 (puerto ya abierto en el Security Group), como ingreso único.
            cat > .env << ENVEOF
            DB_NAME=voucherdb
            DB_USER=admin
            DB_PASSWORD=$DB_PASSWORD
            MOODLE_SITE_URL=http://$EC2_HOST:8095
            MOODLE_ADMIN_PASSWORD=$MOODLE_ADMIN_PASSWORD
            INTERNAL_API_TOKEN=$INTERNAL_API_TOKEN
            GATEWAY_PORT=3000
            ENVEOF

            # .env del servicio Node.js
            cat > servicios/servicio-usuarios/.env << ENVEOF
            DB_HOST=postgres
            DB_PORT=5432
            DB_NAME=voucherdb
            DB_USER=admin
            DB_PASSWORD=$DB_PASSWORD
            JWT_SECRET=$JWT_SECRET
            ADMIN_EMAIL=admin@certjoin.com
            ADMIN_PASSWORD=$ADMIN_PASSWORD
            PARTNER_EMAIL=partner@certjoin.com
            PARTNER_PASSWORD=$PARTNER_PASSWORD
            STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY
            STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY
            STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET
            FRONTEND_URL=https://demo-certjoin.duckdns.org
            PORT=8081
            NODE_ENV=production
            REFRESH_TOKEN_TTL_DAYS=7
            SESSION_TIMEOUT_MINUTES=30
            MAX_LOGIN_ATTEMPTS=10
            RATE_LIMIT_WINDOW_MINUTES=15
            RATE_LIMIT_MAX_REQUESTS=100
            MOODLE_URL=http://moodle:8080
            MOODLE_TOKEN=$MOODLE_TOKEN
            MOODLE_ROLE_ID=5
            MOODLE_MOCK=false
            MOODLE_PUBLIC_URL=$MOODLE_PUBLIC_URL
            CAMPUS_URL=$CAMPUS_URL
            MAIL_ENABLED=$MAIL_ENABLED
            SMTP_HOST=$SMTP_HOST
            SMTP_PORT=$SMTP_PORT
            SMTP_SECURE=$SMTP_SECURE
            SMTP_USER=$SMTP_USER
            SMTP_PASS=$SMTP_PASS
            MAIL_FROM=$MAIL_FROM
            MAIL_FROM_NAME=CertJoin
            MAIL_REPLY_TO=$MAIL_REPLY_TO
            MAIL_LOGO_URL=$MAIL_LOGO_URL
            ENVEOF

            # Restringir permisos de los .env (solo el dueño puede leerlos)
            chmod 600 .env servicios/servicio-usuarios/.env

            # Crear directorio de logs
            mkdir -p logs/usuarios

            # Actualizar buildx
            BUILDX_VER=$(curl -s https://api.github.com/repos/docker/buildx/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
            sudo mkdir -p /usr/local/lib/docker/cli-plugins
            sudo curl -SL "https://github.com/docker/buildx/releases/download/${BUILDX_VER}/buildx-${BUILDX_VER}.linux-amd64" \
              -o /usr/local/lib/docker/cli-plugins/docker-buildx
            sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx

            # Levantar contenedores. Se incluye el override TLS (docker-compose.tls.yml):
            # gateway en :80/:443 con TLS Let's Encrypt (SITE_ADDRESS=dominio DuckDNS).
            docker compose -f docker-compose.yml -f docker-compose.tls.yml --profile local-moodle down --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.tls.yml --profile local-moodle up -d --build

            # Verificar estado
            docker compose -f docker-compose.yml -f docker-compose.tls.yml --profile local-moodle ps

            # Liberar disco: cada build deja imágenes huérfanas y ~300MB de build
            # cache. El EC2 de QA solo tiene 8GB, así que limpiamos lo no usado tras
            # cada deploy (no toca imágenes/volúmenes de contenedores en marcha).
            docker image prune -f || true
            docker builder prune -f || true
