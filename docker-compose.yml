services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: proyecto-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Nota: NO se monta ./database/init.sql como volumen. En Docker Desktop sobre
      # Google Drive (H:) el bind-mount de un archivo suelto falla ("not a directory")
      # y el contenedor no arranca. Además init.sql solo corre la primera vez que el
      # volumen está vacío. Para inicializar la BD localmente, cargar el SQL por stdin:
      #   Get-Content ./database/init.sql -Raw | docker exec -i proyecto-db psql -U admin -d proyectodb
    networks:
      - proyecto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  # Gateway (Caddy): único ingreso. Enruta API/webhooks a servicio-usuarios y el
  # resto (SPA) al frontend. Ver api-gateway/Caddyfile.
  api-gateway:
    build: ./api-gateway
    container_name: proyecto-gateway
    # Puerto del host = ingreso único. Default :3000 (igual que QA, donde GATEWAY_PORT
    # se fija explícitamente). El frontend ya no usa :3000, así que el gateway lo toma.
    ports:
      - "${GATEWAY_PORT:-3000}:8080"
    depends_on:
      - servicio-usuarios
      - servicio-compras
      - frontend
    networks:
      - proyecto-network

  # Mock Moodle Web Services (solo desarrollo local)
  moodle-mock:
    build: ./servicios/moodle-mock
    container_name: moodle-mock
    ports:
      - "8082:8082"
    networks:
      - proyecto-network

  # Microservicio de Usuarios
  servicio-usuarios:
    build: ./servicios/servicio-usuarios
    container_name: servicio-usuarios
    ports:
      - "8081:8081"
    env_file:
      - ./servicios/servicio-usuarios/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - NOTIFICATIONS_URL=http://servicio-notificaciones:8083
      - MOODLE_SERVICE_URL=http://servicio-moodle:8084
      - COMPRAS_URL=http://servicio-compras:8085
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
      servicio-moodle:
        condition: service_started
      servicio-compras:
        condition: service_started
    networks:
      - proyecto-network

  # Microservicio de Notificaciones (correo al estudiante). Extraído de servicio-usuarios.
  # NO expone puerto al host: solo accesible por la red interna de Docker
  # (servicio-usuarios -> http://servicio-notificaciones:8083/internal/send con token interno).
  servicio-notificaciones:
    build: ./servicios/servicio-notificaciones
    container_name: servicio-notificaciones
    expose:
      - "8083"
    env_file:
      - ./servicios/servicio-usuarios/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORT=8083
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proyecto-network
    volumes:
      - ./logs/usuarios:/app/logs

  # Microservicio servicio-moodle (adaptador del Web Services de Moodle). Extraído de
  # servicio-usuarios. NO expone puerto al host: solo accesible por la red interna
  # (servicio-usuarios -> http://servicio-moodle:8084/internal/* con token interno).
  # No usa BD: es un adaptador puro sobre el WS de Moodle.
  servicio-moodle:
    build: ./servicios/servicio-moodle
    container_name: servicio-moodle
    expose:
      - "8084"
    env_file:
      - ./servicios/servicio-usuarios/.env
    environment:
      - PORT=8084
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-internal-token}
    depends_on:
      moodle-mock:
        condition: service_started
    networks:
      - proyecto-network

  # Microservicio servicio-compras (compras + pagos Stripe). Extraído de servicio-usuarios.
  # Sirve sus rutas de usuario vía el gateway (valida JWT/RBAC con la BD compartida) y
  # expone /internal/backfill/:partnerId (token) para la activación en servicio-usuarios.
  servicio-compras:
    build: ./servicios/servicio-compras
    container_name: servicio-compras
    expose:
      - "8085"
    env_file:
      - ./servicios/servicio-usuarios/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORT=8085
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-dev-internal-token}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proyecto-network

  # Frontend
  frontend:
    build: ./frontend
    container_name: proyecto-frontend
    # Sin puerto al host: el frontend se sirve SOLO a través del gateway (mismo origen).
    # El gateway lo alcanza por la red interna como frontend:3000.
    environment:
      - REACT_APP_API_URL=
    networks:
      - proyecto-network
    # Nota: NO se monta ./frontend/public como volumen. En Docker Desktop sobre
    # Google Drive (H:) el bind-mount de directorios aparece vacío en el contenedor
    # y rompe el frontend ("Error cargando la aplicación"). La imagen ya incluye
    # public/ vía COPY, y server.js reemplaza %API_URL% en tiempo de respuesta.
    # Para reflejar cambios en public/ localmente: docker compose up -d --build frontend

  # Base de datos de Moodle (MariaDB oficial, separada del PostgreSQL de la app)
  # Solo arranca con: docker compose --profile local-moodle up -d
  moodle-db:
    image: mariadb:10.11
    container_name: moodle-db
    profiles: [local-moodle]
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword123
      - MYSQL_USER=moodle
      - MYSQL_PASSWORD=moodlepass123
      - MYSQL_DATABASE=moodle
    volumes:
      - moodle_mariadb_data:/var/lib/mysql
    networks:
      - proyecto-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "moodle", "-pmoodlepass123"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Moodle LMS dockerizado.
  # Local:  docker compose --profile local-moodle up -d   (admin/Admin1234! en http://localhost:8095)
  # QA:     el deploy lo levanta con --profile local-moodle y SITE_URL/MOODLE_ADMIN_PASSWORD por env.
  moodle:
    image: erseco/alpine-moodle
    container_name: moodle
    profiles: [local-moodle]
    ports:
      - "8095:8080"
    environment:
      - SITE_URL=${MOODLE_SITE_URL:-http://localhost:8095}
      - DB_TYPE=mariadb
      - DB_HOST=moodle-db
      - DB_PORT=3306
      - DB_NAME=moodle
      - DB_USER=moodle
      - DB_PASS=moodlepass123
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=${MOODLE_ADMIN_PASSWORD:-Admin1234!}
      - MOODLE_EMAIL=admin@certjoin.com
      - MOODLE_SITENAME=CertJOIN-LMS
      - MOODLE_LANGUAGE=es
      - REVERSEPROXY=true
    depends_on:
      moodle-db:
        condition: service_healthy
    volumes:
      - moodle_data:/var/www/html/moodledata
    networks:
      - proyecto-network

  # Mail-catcher local: captura los correos salientes para validarlos visualmente.
  # UI web: http://localhost:8025  |  SMTP interno: mailpit:1025
  # Solo arranca con el perfil local-mail:  docker compose --profile local-mail up -d
  # En QA/PD NO se usa: allí SMTP_HOST apunta a un SMTP real vía variables de entorno.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    profiles: [local-mail]
    ports:
      - "8025:8025"   # UI web del buzón
      - "1025:1025"   # SMTP
    networks:
      - proyecto-network

networks:
  proyecto-network:
    driver: bridge

volumes:
  postgres_data:
  moodle_mariadb_data:
  moodle_data:
  moodle_datadir: